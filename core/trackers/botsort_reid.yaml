# BoT-SORT with appearance re-ID switched on (Ultralytics >= 8.3.114).
# Used by: python main.py --tracker yolo   (default --tracker-cfg)
# Stock file: ultralytics/cfg/trackers/botsort.yaml. Changes from stock are marked.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 60          # changed (30): keep lost tracks 4 s at 15 fps, so short occlusions keep the id
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow # the drone moves: compensate camera motion
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True           # changed (False): match people by appearance too
model: auto               # YOLO's own features: almost free. Or yolo26n-reid.onnx for a real re-ID net
